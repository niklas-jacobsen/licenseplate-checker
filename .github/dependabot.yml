version: 2
updates:
  # Bun workspaces: one root bun.lock covers apps/api, apps/web, apps/docs and
  # packages/shared, so a single entry at the repo root is enough.
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
